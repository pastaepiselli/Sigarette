spring:
  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
    packages:
      trust-all: true
  application:
    name: sigarette
  datasource:
    url: jdbc:postgresql://localhost:5432/sigarette
    username: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
server:
  port: 8080
springdoc:
  api-docs:
    path: /api-docs
