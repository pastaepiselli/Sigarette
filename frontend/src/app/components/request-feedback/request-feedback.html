<div class="feedback-panel" [attr.role]="isError() ? 'alert' : 'status'">
  <div>
    <h3>{{ title() }}</h3>
    @if (message()) {
      <p>{{ message() }}</p>
    }
  </div>
  @if (retryLabel(); as label) {
    <button type="button" class="button button-secondary" (click)="retry.emit()">
      {{ label }}
    </button>
  }
</div>
